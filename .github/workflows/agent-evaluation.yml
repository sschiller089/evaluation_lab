name: Agent quality gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      variant:
        description: "Agent to evaluate (regression deliberately fails the gate)"
        required: true
        default: baseline
        type: choice
        options: [baseline, regression]
  workflow_call:
    inputs:
      variant:
        description: Agent variant to evaluate
        required: false
        default: baseline
        type: string

permissions:
  contents: read

concurrency:
  group: agent-quality-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  tests:
    name: Tool contracts and gate tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agentcore-demo/requirements.lock.txt
      - name: Install pinned dependencies
        run: python -m pip install -r agentcore-demo/requirements.lock.txt
      - name: Test without AWS access
        working-directory: agentcore-demo
        env:
          GITHUB_STEP_SUMMARY: ""
        run: python -m unittest discover -v

  evaluate:
    name: AgentCore quality gate
    needs: tests
    # Pull requests receive offline checks. Only main may assume the AWS role.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: eu-central-1
      AWS_DEFAULT_REGION: eu-central-1
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      EVALUATION_VARIANT: ${{ inputs.variant || 'baseline' }}
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
    steps:
      - name: Check deployment configuration
        shell: bash
        run: |
          test "$GITHUB_REF" = "refs/heads/main" || {
            echo "::error::AWS evaluations must run from main."
            exit 1
          }
          test -n "$AWS_ROLE_ARN" || {
            echo "::error::Set repository variable AWS_ROLE_ARN using deploy/github-actions-iam.yaml."
            exit 1
          }
          [[ "$AWS_ACCOUNT_ID" =~ ^[0-9]{12}$ ]] || {
            echo "::error::Set repository variable AWS_ACCOUNT_ID to the expected AWS account."
            exit 1
          }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agentcore-demo/requirements.lock.txt
      - name: Install pinned dependencies
        run: python -m pip install -r agentcore-demo/requirements.lock.txt
      - name: Assume the evaluation role
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}
          role-session-name: evaluation-${{ github.run_id }}-${{ github.run_attempt }}
          role-duration-seconds: 1800
          unset-current-credentials: true
      - name: Evaluate the exact checkout against the golden cases
        working-directory: agentcore-demo
        run: |
          python run_ci_evaluation.py run \
            --variant "$EVALUATION_VARIANT" \
            --region "$AWS_REGION" \
            --expected-account-id "$AWS_ACCOUNT_ID" \
            --output results/ci-evaluation.json
      - name: Preserve scores, reasons, traces and source revision
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agent-evaluation-${{ github.run_id }}-${{ github.run_attempt }}
          path: agentcore-demo/results/
          if-no-files-found: warn
          retention-days: 14
